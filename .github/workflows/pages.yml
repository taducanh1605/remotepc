name: Deploy streaming PWA

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate distribution allowlist and hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path("site")
          manifest = json.loads((root / "distribution.json").read_text())
          assert re.fullmatch(r"stream-[0-9a-f]{16}\.js", manifest["entry"])
          expected = {"index.html", "style.css", "sw.js", "microphone-worklet.js",
                      "manifest.webmanifest", "icon.svg", "icon-192.png", "icon-512.png",
                      "COPYING.txt", "SOURCE.txt", manifest["entry"]}
          assert set(manifest["files"]) == expected
          assert {p.name for p in root.iterdir()} == expected | {"distribution.json"}
          for name, digest in manifest["files"].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
